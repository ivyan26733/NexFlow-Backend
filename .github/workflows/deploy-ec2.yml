name: Test & Deploy to EC2

# Push to master: run tests → build JAR → copy to EC2 → restart → health check (auto-rollback on failure).
# Pull requests: tests only.
# Required repo secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - name: Test
        run: ./mvnw -B -q test

      - name: Package
        run: ./mvnw -B -q package -DskipTests && cp target/nexflow-backend-*.jar app.jar

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Upload JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app.jar
          target: /tmp/nexflow-deploy

      - name: Swap JAR, restart, health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/nexflow-backend
            cp app.jar app.jar.prev
            mv /tmp/nexflow-deploy/app.jar app.jar
            sudo systemctl restart nexflow-backend

            for i in $(seq 1 30); do
              if curl -sf localhost:8090/actuator/health >/dev/null; then
                echo "Backend healthy"; exit 0
              fi
              sleep 3
            done

            echo "Health check failed — rolling back to previous JAR"
            mv app.jar.prev app.jar
            sudo systemctl restart nexflow-backend
            exit 1
