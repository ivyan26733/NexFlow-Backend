version: '3.8'

# Runs PostgreSQL + Redis only.
# The Spring Boot JAR runs directly on the host (java -jar app.jar).
# Usage:
#   cp .env.example .env    # fill in PGPASSWORD, JWT_SECRET, etc.
#   docker compose -f docker-compose.prod.yml up -d

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PGDATABASE:-nexflow}
      POSTGRES_USER:     ${PGUSER:-nexflow}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # only the JAR on this host can connect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-nexflow} -d ${PGDATABASE:-nexflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis (dashboard cache) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
