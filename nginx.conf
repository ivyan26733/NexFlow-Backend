server {
    listen 80;
    server_name _;  # Replace with your domain or EC2 public IP

    # Matches spring.servlet.multipart.max-request-size (file uploads, Run with file)
    client_max_body_size 50M;

    # ── Assistant (Spring Boot) — own block for a longer timeout: one answer can take several LLM calls ──
    location /api/assistant/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # ── Agent API (Node.js on localhost:3001) ────────────────────────────
    location /api/agent/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── REST API (Spring Boot JAR on localhost:8090) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /actuator/health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
}
