# Test profile: in-memory H2 instead of Postgres; no Redis, SMTP or Google login needed.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.expiry-ms=3600000
app.frontend.url=http://localhost:3000
app.local-dev=true
app.cors.allowed-origins=http://localhost:3000

spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.google.scope=email,profile

spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
management.health.mail.enabled=false

# Keep the schedule poller out of the way during tests.
app.schedules.initial-delay-ms=3600000
